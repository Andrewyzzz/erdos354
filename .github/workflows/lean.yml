name: Lean verification

on:
  push:
    branches: [main, lean-formalization]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lean 4.27.0 / full build and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: "2"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test release guards
        run: python3 -m unittest discover -s formalization/scripts -p 'test_*.py' -v

      - name: Check package integrity and finite certificate
        run: |
          python3 verification/check_manifest.py
          python3 certificate/check_templates.py

      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: formalization
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"

      - name: Retrieve only the pinned dependency cache
        working-directory: formalization
        run: lake exe cache get

      - name: Build all project sources and audit every theorem
        working-directory: formalization
        run: python3 scripts/verify.py --log-directory logs/ci

      - name: Publish build and audit records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-verification-${{ github.sha }}
          path: formalization/logs/ci/
          if-no-files-found: warn
          retention-days: 90
